{{/* 保留封面卷首语；栏目导航只由顶栏承担。 */}}
<section class="cover-home-intro" data-cover-intro aria-labelledby="cover-home-title">
  <h1 id="cover-home-title">{{ .headline | default site.Title }}</h1>
  {{ with .description }}<p class="cover-home-intro__description">{{ . }}</p>{{ end }}
</section>
<a class="cover-explore-prompt" href="#home-recent" data-cover-explore>
  <span class="cover-explore-prompt__label">{{ .explore_label | default "Scroll to explore" }}</span>
  <span class="cover-explore-prompt__arrows" aria-hidden="true">
    <span class="cover-explore-prompt__arrow"></span>
    <span class="cover-explore-prompt__arrow"></span>
  </span>
</a>
