# =============================================================================
# lyrumu's site — Hugo configuration
# Theme: Blowfish · 部署 github&&Cloudflare Pages
#   - 加新模块 = hugo.toml [[menu.main]] 加项 + content/<slug>/_index.md
# 本地服务启动方式：
# hugo server --themesDir themes --theme blowfish --config hugo.toml --bind 127.0.0.1 --port 8080（端口可选）
# 本项目除了存在通过创建同名文件覆写部分themes外 还对themes文件本身做过改写 升级主题时要注意备份
# =============================================================================

baseURL = 'https://lyrumu.top/'
defaultContentLanguage = 'en'
title = "lyrumu's page"

# theme 必须声明在任何 [table] 头之前（TOML 规则：表头之后的键都属于该表）。
# 2026-08-29 修复：原先写在中部，被归入 [languages.en.params.author] 表，
# 根级 theme 实际为空，裸 `hugo` 构建时主题不加载，全靠命令行 --theme 兜底。
theme = 'blowfish'

# =============================================================================
# 多语言
# 默认语言从 zh-cn 改为 en（2026-06-24）
# - 语言键重命名 [languages.zh-cn] → [languages.en]
# - label / displayName / isoCode / locale 同步更新为英文
# - contentDir 仍为 'content'，URL 路径不变，无需迁移文件
# =============================================================================
[languages.en]
  label = 'English'
  weight = 1
  locale = 'en-US'
  contentDir = 'content'
  title = "lyrumu's page"

  [languages.en.params]
    displayName = 'English'
    isoCode = 'en'
    rtl = false
    dateFormat = '2006-01-02'
    logo = ''
    description = "lyrumu's personal website — a collection of learning notes, projects, resources, and daily records."

    [languages.en.params.author]
      name = 'lyrumu'
      email = ''

      # 作者头像图片，会在页面的作者信息区域显示（如文章页作者栏、关于页面等）
      # 图片路径写法：
      # 本地图片支持两种存放方式，二选一即可：
      # 1. 放入 assets/images/ 目录，引用时写相对根目录的路径，例如 'images/avatar.jpg'
      # 2. 放入 static/ 目录，引用时写完整的相对根路径，例如放在 static/images/ 则写 '/images/avatar.jpg'
      # 2. 外部图片：直接填写完整的 CDN/在线图片 URL，例如 'https://example.com/avatar.jpg'
      image = 'image/melody.webp'

      headline = 'Recordings'
      bio = ''
      links = [
        { github = 'https://github.com/lyrumu' },
      ]

# =============================================================================
# 主题与构建
# （theme = 'blowfish' 已移至文件顶部根级，见文件开头注释）
# =============================================================================

relativeURLs = false
disablePathToLower = true
enableRobotsTXT = true

# 文章正文以中文居多 → 保留 CJK 分词/字数/换行规则
# 与 defaultContentLanguage = 'en' 不冲突：
# - defaultContentLanguage 管 URL/i18n/语言切换
# - hasCJKLanguage    管正文分词、summaryLength、阅读时间
hasCJKLanguage = true
summaryLength = 30
enableEmoji = true

# =============================================================================
# 站点参数
# =============================================================================
[params]
  colorScheme = 'blowfish' 
  defaultAppearance = 'light'
  autoSwitchAppearance = false
  enableSearch = true
  enableCodeCopy = true
  enableImageLazyLoad = true
  enableBreadcrumbs = true
  enableStructuredBreadcrumbs = true
  highlightCurrentMenuArea = true
  smartTOC = true
  copyright = "All Rights Reserved © { year } lyrumu"
  copyrightStartYear = 2026

  # 哪些 section 会出现在"最近更新" / 侧栏 quick links
  mainSections = ['notes', 'life', 'works', 'about']

  defaultBackgroundImage = ''
  defaultFeaturedImage = ''

  # =====================================================================
  # 首页（封面）布局：使用 custom 布局，渲染在
  #   layouts/partials/home/custom.html
  # 数据驱动：data/cover.yaml
  # =====================================================================
  [params.homepage]
    layout = 'custom'                  # background / hero / page / card / custom
    showRecent = false
    showQuickLinks = false
    showSummary = false
    cardViewSimple = false
    disableSpecialFirstPost = true
    mainSections = ['notes', 'works', 'life']

  # 列表页（/notes/ /works/ /life/ 等）的"列表卡片"行为
  # （被 [params.homepage] 影响，但独立可控）
  [params.list]
    showHero = false
    showSummary = true
    showBreadcrumbs = true
    showTableOfContents = false
    showCards = true
    cardView = true
    groupByYear = false
    orderByWeight = true

  [params.article]
    showHero = true
    heroStyle = 'background'
    showDate = true
    showDateUpdated = false
    showAuthor = true
    showBreadcrumbs = true
    showDraftLabel = true
    showTableOfContents = true
    showReadingTime = true
    showWordCount = true
    showRelatedContent = true #管理相关近期文章的显示
    relatedContentLimit = 6
    showComments = true
    showZenMode = true
    showViews = false
    showLikes = false
    # 仅提供编辑入口，真正能否改内容仍由 GitHub 仓库权限决定。
    # 这里先提供基础编辑 URL，是否显示由具体页面/section 控制。
    editURL = 'https://github.com/lyrumu/lyrumu-site/edit/master/content'
    editAppendPath = true
    sharingLinks = ['github', 'twitter', 'email']

  [params.term]
    showHero = true
    showBreadcrumbs = true
    showTableOfContents = true
    cardView = true

  [params.taxonomy]
    showTermCount = true
    showHero = true
    showBreadcrumbs = true
    showTableOfContents = true
    cardView = true

  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.header]
    layout = 'fixed'                  # basic / fixed / fixed-fill / fixed-gradient / fixed-fill-blur

  [params.cover]
    linkFullImages = true
    hiddenInList = false

  # 2026-06-27：接入 Umami（走 Blowfish 原生 analytics partial，而非手写 head script）
  # 2026-06-30：暂时关闭 — cloud.umami.is 在国内有连接开销，影响加载
  # [params.umamiAnalytics]
  #   websiteid = '515c1183-2e68-4a62-8fd9-b879507a9f28'
  #   domain = 'cloud.umami.is'
  #   enableTrackEvent = true

  # 2026-06-27：接入 Blowfish 原生 Firebase views / likes。
  # 说明：
  # - 这些字段会下发到前端，暴露是正常现象
  # - 真正的安全边界在 Firestore Rules 与 Anonymous Auth 配置
  [params.firebase]
    apiKey = 'AIzaSyACFy-CEDyqeBnLmxnaUJwBQvW_wAQ1Rdg'
    authDomain = 'lyrumu-s-page.firebaseapp.com'
    projectId = 'lyrumu-s-page'
    storageBucket = 'lyrumu-s-page.firebasestorage.app'
    messagingSenderId = '1323464530'
    appId = '1:1323464530:web:879b7339ed1601f4546c8b'
    measurementId = 'G-5ZD6M1S9NG'

# =============================================================================
# 顶部分类导航
# 加模块 = 在这里加一项 + content/<slug>/_index.md
# 顺序：按 weight 从小到大
# =============================================================================
# 主导航：ABOUT ME / DOCS / WORKS / DAILY 全部回归普通菜单项
[[menu.main]]
  name = 'ABOUT ME'
  url = '/about/'
  # weight 参数用于控制导航菜单的排序顺序，数值越小越靠前显示
  weight = 10

[[menu.main]]
  name = 'DOCS'
  url = '/notes/'
  weight = 20

[[menu.main]]
  name = 'WORKS'
  url = '/works/'
  weight = 30

[[menu.main]]
  name = 'DAILY'
  url = '/life/'
  weight = 40

# =============================================================================
# 输出格式（2026-06-24 修正两个 WARN）
# - 加 page = ['HTML']：消除 "no layout file for html for kind page" 警告
#   （不写 page 时 Hugo 用默认 _default/single.html 也能渲染，但会发 WARN）
# - JSON 保留：home 直接复用主题的 _default/index.json；旧 background
#   frontmatter 与重复 layouts/home.json 已在首页封面收尾时移除
# =============================================================================
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML']
  page = ['HTML']

# =============================================================================
# 标记与渲染
# =============================================================================
[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = false
    style = 'github-dark'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# =============================================================================
# 分面（标签 / 主题 / 分类 / 系列）
# =============================================================================
[taxonomies]
  category = 'categories'
  tag = 'tags'
  topic = 'topics'
  series = 'series'

# 抑制已知无害的日志
# - warning-goldmark-raw-html：blowfish 主题原 html 写法触发，金标 markdown 的已知噪音
ignoreLogs = ["warning-goldmark-raw-html"]
