# =============================================================================
# /notes/ 文章封面 / 图标配置
# -----------------------------------------------------------------------------
# 作用：为 DOCS 页每篇文章右侧提供自定义图片或降级图标。
#
# 读取优先级（在 layouts/partials/article-link/card.html 中实现）：
#   1. items[].image（真实图片路径）
#   2. 文章 frontmatter 中的 featureimage / *cover* / *thumbnail* 页面资源
#   3. items[].icon（Lucide 图标名）
#   4. 按 fallback_tag 或文章首个 tag 在 tag_icons 中匹配图标
#   5. 默认图标（notebook）
# -----------------------------------------------------------------------------
# 图片存放约定（2026-08-05 起）：
#   - 真实图片放在 assets/image/notes/<slug>.<ext>，然后写 image/notes/<slug>.<ext>
#     （resources.Get 只会处理 assets/ 下的文件，才能走 Hugo 缩放 → WebP → 模糊占位管线）
#   - 封面转 WebP 时：把 assets/image/notes/<slug>.png 替换为同名的 .webp，并同步改下面的扩展名
# =============================================================================

# tag → Lucide 图标名 的自动映射（用于无图无 icon 时的降级）
tag_icons:
  ai: brain
  agent: brain
  chatgpt: brain
  codex: brain
  openai: brain
  tools: hammer
  software: hammer
  resources: hammer
  development: code-2
  devops: wrench
  git: code-2
  github: code-2
  linux: wrench
  wsl2: wrench
  ubuntu: wrench
  python: package
  vscode: code-2
  venv: package
  pip: package
  setuptools: package
  browser: wrench
  website: wrench
  terminal: wrench
  plugin: wrench
  tips: notebook
  config: notebook
  skill: notebook
  mcp: notebook
  subscription: notebook

# 每篇文章的独立配置
items:
  - slug: Codex-Plus
    image: "image/notes/Codex-Plus.webp"
    icon: brain
    fallback_tag: ai

  - slug: for-agents
    image: "image/notes/for-agent.webp"
    icon: brain
    fallback_tag: agent

  - slug: git-guide
    image: "image/notes/git.webp"
    icon: code-2
    fallback_tag: git

  - slug: good-tools
    image: "image/notes/good-tools.webp"
    icon: hammer
    fallback_tag: tools

  - slug: 使用chezmoi管理dot-files
    image: "image/notes/chezmoi.webp"
    icon: folder-sync
    fallback_tag: tools

  - slug: linux-getting-started
    image: "image/notes/linux.webp"
    icon: wrench
    fallback_tag: linux

  - slug: python-env-setup
    image: "image/notes/python-package.webp"
    icon: package
    fallback_tag: python

  - slug: Mac的一些系统配置
    image: "image/notes/Mac的一些系统配置.png"
    icon: wrench
    fallback_tag: os

  - slug: 影视飓风AI课程总结
    image: "image/notes/影视飓风AI课程总结.png"
    icon: brain
    fallback_tag: ai

  - slug: Flutter项目部署至ios
    image: "image/notes/Flutter项目部署至ios.png"
    icon: smartphone
    fallback_tag: development
