# =============================================================================
# Music 子页的歌单数据 — /life/music/
# 渲染源:  layouts/shortcodes/music-list.html + layouts/partials/music-player.html
# 想加 / 删 / 调：改本文件即可，页面无需动
#
# 字段说明：
#   - title    : 歌名
#   - artist   : 歌手（可空）
#   - album    : 专辑（可空）
#   - cover    : 封面资源路径（推荐 image/music/<slug>.webp，源图放 assets/image/music/）
#   - src      : 30s 试听片段 url（推荐放到 /life/music/preview/<slug>.mp3）
#   - duration : 列表显示的时长（mm:ss）；播放器加载当前曲目后另用 audio.duration 显示实际时长
#   - mood     : 心情记录（可空，当前模板不渲染）
#   - note     : 一句话小记（可空）
#   - links    : 外链列表，每条 { label, url }
#                label 可选值：spotify / apple
#                模板只渲染这两个平台，多写也不会显示（白名单在 shortcode 里）
#                Apple Music：建议填精确 trackViewUrl（从 iTunes Search API 拿），
#                            点进去直达歌曲页
#                Spotify：无免费精确接口，使用 search URL，
#                         未登录态会被引导登录，登录态直接进搜索结果
#
# 合规说明：
#   - src 仅放 ≤30s 试听片段，不提供下载
#   - 全曲收听请走 links 列表里的官方平台
# =============================================================================
