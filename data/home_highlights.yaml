# 首页固定三入口数据契约，顺序即首帧索引和卡片显现顺序。
# - sections 必须正好为 3 组；id 必须唯一。
# - visual.kind 与图片数量：docs-stack=3、project-stage=1、music-fan=3。
sections:
  - id: "docs"
    desc: "Notes on coding, tools, and ideas worth keeping."
    cta_label: "Read notes"
    cta_path: "/notes/"
    visual:
      kind: "docs-stack"
      alt: "Selected covers from the documentation archive"
      assets:
        - "image/notes/Codex-Plus.webp"
        - "image/notes/for-agent.webp"
        - "image/notes/git.webp"

  - id: "works"
    desc: "Small personal projects and demos to explore."
    cta_label: "View projects"
    cta_path: "/works/projects/"
    visual:
      kind: "project-stage"
      alt: "Geometric artwork from the linear algebra project"
      assets:
        - "image/projects/linear-algebra-cover.webp"

  - id: "daily"
    desc: "Japanese anime songs and Jay Chou in one playlist."
    cta_label: "Browse music"
    cta_path: "/life/music/"
    visual:
      kind: "music-fan"
      alt: "A selection of album covers from the current playlist"
      assets:
        - "image/music/cover-Departures.webp"
        - "image/music/cover-my-dearest.webp"
        - "image/music/cover-unravel.webp"
